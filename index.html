<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Transparent White Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .controls {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .value-display {
            min-width: 50px;
            text-align: right;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-section.active {
            display: block;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .preview-box {
            text-align: center;
        }

        .preview-label {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: 
                repeating-linear-gradient(45deg, #f0f0f0 0px, #f0f0f0 10px, #ffffff 10px, #ffffff 20px);
        }

        .preview-image.black-bg {
            background: #000;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 20px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .processing {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-top: 20px;
        }

        .processing.hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .preview-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Image to Transparent White</h1>
        <p class="subtitle">Convert images to white transparent PNGs for Twitter</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Drag & Drop Image Here</div>
            <div class="upload-hint">or click to select a file</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="opacitySlider">Max Opacity: <span class="value-display" id="opacityValue">100%</span></label>
                <div class="slider-container">
                    <input type="range" id="opacitySlider" min="0" max="100" value="100">
                </div>
            </div>
            <div class="control-group">
                <label for="contrastSlider">Contrast: <span class="value-display" id="contrastValue">1.2x</span></label>
                <div class="slider-container">
                    <input type="range" id="contrastSlider" min="50" max="200" value="120">
                </div>
            </div>
            <div class="control-group">
                <label for="brightnessSlider">Brightness: <span class="value-display" id="brightnessValue">1.0x</span></label>
                <div class="slider-container">
                    <input type="range" id="brightnessSlider" min="50" max="200" value="100">
                </div>
            </div>
        </div>

        <div class="processing hidden" id="processing">Processing image...</div>

        <div class="preview-section" id="previewSection">
            <div class="preview-container">
                <div class="preview-box">
                    <div class="preview-label">Preview (Transparent)</div>
                    <img id="previewTransparent" class="preview-image" alt="Transparent preview">
                </div>
                <div class="preview-box">
                    <div class="preview-label">Preview (Black Background)</div>
                    <img id="previewBlackBg" class="preview-image black-bg" alt="Black background preview">
                </div>
            </div>
            <button class="download-btn" id="downloadBtn">⬇️ Download Transparent PNG</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const opacitySlider = document.getElementById('opacitySlider');
        const contrastSlider = document.getElementById('contrastSlider');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const opacityValue = document.getElementById('opacityValue');
        const contrastValue = document.getElementById('contrastValue');
        const brightnessValue = document.getElementById('brightnessValue');
        const previewSection = document.getElementById('previewSection');
        const previewTransparent = document.getElementById('previewTransparent');
        const previewBlackBg = document.getElementById('previewBlackBg');
        const downloadBtn = document.getElementById('downloadBtn');
        const processing = document.getElementById('processing');

        let currentImageData = null;
        let originalImage = null;

        // Drag and drop handlers
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Update value displays
        opacitySlider.addEventListener('input', () => {
            opacityValue.textContent = opacitySlider.value + '%';
            if (currentImageData) processImage();
        });
        contrastSlider.addEventListener('input', () => {
            contrastValue.textContent = (contrastSlider.value / 100).toFixed(1) + 'x';
            if (currentImageData) processImage();
        });
        brightnessSlider.addEventListener('input', () => {
            brightnessValue.textContent = (brightnessSlider.value / 100).toFixed(1) + 'x';
            if (currentImageData) processImage();
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage = new Image();
                originalImage.onload = () => {
                    currentImageData = {
                        image: originalImage,
                        file: file
                    };
                    processImage();
                };
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processImage() {
            if (!currentImageData) return;

            processing.classList.remove('hidden');
            
            // Small delay to show processing message
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = currentImageData.image;
                
                canvas.width = img.width;
                canvas.height = img.height;

                // Draw original image
                ctx.drawImage(img, 0, 0);

                // Get image data
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                // Convert to grayscale with contrast and brightness
                const contrast = contrastSlider.value / 100;
                const brightness = brightnessSlider.value / 100;
                const maxOpacity = opacitySlider.value / 100;

                for (let i = 0; i < data.length; i += 4) {
                    // Get RGB values
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // Convert to grayscale (luminance formula)
                    let gray = 0.299 * r + 0.587 * g + 0.114 * b;

                    // Apply brightness
                    gray = gray * brightness;

                    // Apply contrast (centered around 128)
                    gray = ((gray - 128) * contrast) + 128;

                    // Clamp values
                    gray = Math.max(0, Math.min(255, gray));

                    // Map grayscale to opacity (0-255 alpha)
                    const alpha = Math.round((gray / 255) * maxOpacity * 255);

                    // Set to white with calculated opacity
                    data[i] = 255;     // R
                    data[i + 1] = 255; // G
                    data[i + 2] = 255; // B
                    data[i + 3] = alpha; // A
                }

                // Put modified data back
                ctx.putImageData(imageData, 0, 0);

                // Create preview images
                const transparentUrl = canvas.toDataURL('image/png');
                previewTransparent.src = transparentUrl;

                // Create black background preview
                const blackBgCanvas = document.createElement('canvas');
                const blackBgCtx = blackBgCanvas.getContext('2d');
                blackBgCanvas.width = canvas.width;
                blackBgCanvas.height = canvas.height;
                blackBgCtx.fillStyle = '#000000';
                blackBgCtx.fillRect(0, 0, blackBgCanvas.width, blackBgCanvas.height);
                blackBgCtx.drawImage(canvas, 0, 0);
                previewBlackBg.src = blackBgCanvas.toDataURL('image/png');

                // Store canvas for download
                currentImageData.processedCanvas = canvas;
                currentImageData.transparentUrl = transparentUrl;

                previewSection.classList.add('active');
                processing.classList.add('hidden');
            }, 50);
        }

        downloadBtn.addEventListener('click', () => {
            if (!currentImageData || !currentImageData.transparentUrl) return;

            const link = document.createElement('a');
            link.download = currentImageData.file.name.replace(/\.[^/.]+$/, '') + '_transparent.png';
            link.href = currentImageData.transparentUrl;
            link.click();
        });
    </script>
</body>
</html>
