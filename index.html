<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TransparentXImages · White transparent PNGs for X</title>
<meta name="description" content="Turn any image into a white, transparent PNG that looks right on X's black background. Free and fully in your browser.">
<meta property="og:title" content="TransparentXImages">
<meta property="og:description" content="Turn any image into a white, transparent PNG that looks right on X's black background.">
<meta property="og:image" content="https://05v.github.io/TransparentXImages/docs/social-preview.png">
<meta name="theme-color" content="#0b0b0b">
<style>
  :root {
    --bg: #0b0b0b;
    --panel: #141414;
    --line: #242424;
    --text: #f2f2f2;
    --mute: #8c8c8c;
    --accent: #ff4f8b;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    min-height: 100%;
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
  }
  aside {
    border-right: 1px solid var(--line);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .lede { color: var(--mute); margin-top: 4px; }

  .drop {
    position: relative;
    border: 1px dashed #3a3a3a;
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    color: var(--mute);
    cursor: pointer;
    transition: border-color .2s var(--ease), background-color .2s var(--ease);
  }
  .drop strong { display: block; color: var(--text); font-weight: 500; }
  .drop:hover, .drop.over { border-color: var(--accent); background: rgb(255 79 139 / .05); }
  .drop input { display: none; }
  .file { color: var(--mute); font-size: 13px; margin-top: 8px; word-break: break-all; }

  .control label { display: flex; justify-content: space-between; font-size: 13px; color: var(--mute); margin-bottom: 8px; }
  .control output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .toggle { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mute); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  .download {
    margin-top: auto;
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 13px 16px;
    background: var(--accent);
    color: #0b0b0b;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s var(--ease), opacity .2s var(--ease);
  }
  .download:active { transform: scale(.98); }
  .download:disabled { opacity: .35; cursor: default; }
  .source { color: var(--mute); font-size: 13px; text-align: center; text-decoration: none; margin-top: -8px; }
  .source:hover { color: var(--text); }

  main { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .bar {
    display: flex;
    justify-content: flex-end;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
  }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; background: none; color: var(--mute);
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    transition: color .2s var(--ease), background-color .2s var(--ease);
  }
  .seg button[aria-pressed=true] { background: #262626; color: var(--text); }
  .stage { display: grid; place-items: center; padding: 32px; min-height: 0; }
  .stage.black { background: #000; }
  .stage.checker {
    background-color: #1a1a1a;
    background-image: conic-gradient(#262626 25%, transparent 0 50%, #262626 0 75%, transparent 0);
    background-size: 24px 24px;
  }
  canvas { max-width: 100%; max-height: calc(100vh - 140px); display: none; }
  .empty { color: var(--mute); text-align: center; }
  .empty kbd { font: inherit; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--text); }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    canvas { max-height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>TransparentXImages</h1>
      <p class="lede">Turn any image into a white, transparent PNG that looks right on X's black background.</p>
    </div>

    <label class="drop" id="drop">
      <strong>Drop an image</strong>
      or click to choose, or paste
      <input type="file" id="file" accept="image/*">
      <div class="file" id="fileName"></div>
    </label>

    <div class="control">
      <label for="opacity">Max opacity <output id="opacityOut">100%</output></label>
      <input type="range" id="opacity" min="0" max="100" value="100">
    </div>
    <div class="control">
      <label for="contrast">Contrast <output id="contrastOut">1.2x</output></label>
      <input type="range" id="contrast" min="50" max="200" value="120">
    </div>
    <div class="control">
      <label for="brightness">Brightness <output id="brightnessOut">1.0x</output></label>
      <input type="range" id="brightness" min="50" max="200" value="100">
    </div>
    <label class="toggle"><input type="checkbox" id="invert"> Invert (dark subject on a light background)</label>

    <button class="download" id="download" disabled>Download PNG</button>
    <a class="source" href="https://github.com/05v/TransparentXImages">Source on GitHub</a>
  </aside>

  <main>
    <div class="bar">
      <div class="seg" role="group" aria-label="Preview background">
        <button type="button" data-bg="black" aria-pressed="true">On black</button>
        <button type="button" data-bg="checker" aria-pressed="false">Transparent</button>
      </div>
    </div>
    <div class="stage black" id="stage">
      <div class="empty" id="empty">Your image shows up here.<br>Tip: <kbd>Cmd</kbd> + <kbd>V</kbd> pastes from the clipboard.</div>
      <canvas id="preview"></canvas>
    </div>
  </main>
</div>

<script>
(() => {
  const PREVIEW_MAX = 1400; // longest side of the live preview; the download is full size

  const $ = (id) => document.getElementById(id);
  const drop = $('drop'), fileInput = $('file'), fileName = $('fileName');
  const sliders = { opacity: $('opacity'), contrast: $('contrast'), brightness: $('brightness') };
  const invert = $('invert'), download = $('download');
  const stage = $('stage'), empty = $('empty'), preview = $('preview');

  let source = null; // { image, name }
  let queued = false;

  function settings() {
    return {
      maxOpacity: sliders.opacity.value / 100,
      contrast: sliders.contrast.value / 100,
      brightness: sliders.brightness.value / 100,
      invert: invert.checked,
    };
  }

  // Luminance becomes alpha: bright pixels end up solid white, dark ones fade to transparent.
  // The source's own alpha is kept, so already transparent areas stay transparent.
  function convert(imageData, s) {
    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      let gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      if (s.invert) gray = 255 - gray;
      gray = (gray * s.brightness - 128) * s.contrast + 128;
      gray = gray < 0 ? 0 : gray > 255 ? 255 : gray;
      d[i] = d[i + 1] = d[i + 2] = 255;
      d[i + 3] = Math.round(gray * s.maxOpacity * (d[i + 3] / 255));
    }
    return imageData;
  }

  function render(canvas, maxSide) {
    const { image } = source;
    const scale = maxSide ? Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight)) : 1;
    canvas.width = Math.round(image.naturalWidth * scale);
    canvas.height = Math.round(image.naturalHeight * scale);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    ctx.putImageData(convert(ctx.getImageData(0, 0, canvas.width, canvas.height), settings()), 0, 0);
  }

  // Coalesce slider input into one render per frame
  function schedule() {
    if (!source || queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; render(preview, PREVIEW_MAX); });
  }

  function load(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      source = { image, name: file.name || 'image.png' };
      fileName.textContent = source.name;
      empty.style.display = 'none';
      preview.style.display = 'block';
      download.disabled = false;
      render(preview, PREVIEW_MAX);
    };
    image.src = url;
  }

  function updateOutputs() {
    $('opacityOut').textContent = sliders.opacity.value + '%';
    $('contrastOut').textContent = (sliders.contrast.value / 100).toFixed(1) + 'x';
    $('brightnessOut').textContent = (sliders.brightness.value / 100).toFixed(1) + 'x';
  }

  Object.values(sliders).forEach((el) => el.addEventListener('input', () => { updateOutputs(); schedule(); }));
  invert.addEventListener('change', schedule);

  fileInput.addEventListener('change', () => load(fileInput.files[0]));
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); });
  window.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (item) load(item.getAsFile());
  });

  document.querySelectorAll('.seg button').forEach((btn) => btn.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    stage.className = 'stage ' + btn.dataset.bg;
  }));

  download.addEventListener('click', () => {
    if (!source) return;
    const full = document.createElement('canvas');
    render(full);
    full.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = source.name.replace(/\.[^/.]+$/, '') + '_transparent.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });

  updateOutputs();
})();
</script>
</body>
</html>
